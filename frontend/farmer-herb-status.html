<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmer Herb Status | AyurTrace</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="text-center mb-4">🌿 Your Herb Verification Status</h2>

    <div class="table-responsive">
      <table class="table table-bordered table-striped align-middle text-center">
        <thead class="table-success">
          <tr>
            <th>Farmer Name</th>
            <th>Crop Type</th>
            <th>Harvest Date</th>
            <th>Land Details</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="statusTableBody"></tbody>
      </table>
    </div>
  </div>

 
   <script>
const tableBody = document.getElementById("statusTableBody");
const farmerEmail = localStorage.getItem("farmerEmail");

async function loadFarmerStatus() {
  if (!farmerEmail) {
    alert("You must log in first!");
    return;
  }

  try {
    const res = await fetch(`http://localhost:4000/farmer/status/${farmerEmail}`);
    const data = await res.json();

    tableBody.innerHTML = "";
    if (!data.length) {
      tableBody.innerHTML = "<tr><td colspan='5'>No herb submissions found.</td></tr>";
      return;
    }

    data.forEach((farmer) => {
      let statusClass = "text-warning";
      if (farmer.status?.toLowerCase().includes("approved")) statusClass = "text-success";
      else if (farmer.status?.toLowerCase().includes("rejected")) statusClass = "text-danger";

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${farmer.farmer_name}</td>
        <td>${farmer.crop_type}</td>
        <td>${farmer.harvest_date ? farmer.harvest_date.split("T")[0] : "—"}</td>
        <td>${farmer.land_details}</td>
        <td class="${statusClass}">${farmer.status}</td>
      `;
      tableBody.appendChild(row);
    });
  } catch (err) {
    console.error("Error:", err);
    tableBody.innerHTML = "<tr><td colspan='5'>Error fetching data</td></tr>";
  }
}

loadFarmerStatus();
</script>

  
</body>
</html>
