<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Dashboard | AyurTrace</title>

      <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/farmer.css">

  <style>
    body { font-family: "Poppins", sans-serif; background: #f0f9f4; margin: 0; }
    header { background: #2d6a4f; color: white; padding: 1rem 2rem; }
    .header-container { display: flex; justify-content: space-between; align-items: center; }
    .header-container img { height: 40px; margin-right: 10px; border-radius: 8px; }
    nav a { color: white; margin-right: 20px; text-decoration: none; font-weight: 500; }
    .logout-btn { background: #c1121f; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .logout-btn:hover { background: #780000; }
    .dashboard-container { max-width: 1000px; margin: 2rem auto; background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
    h2 { color: #1b4332; margin-bottom: 1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 6px; border-radius: 6px; border: 1px solid #ccc; }
    button { margin-top: 1rem; padding: 10px 20px; background: #2d6a4f; border: none; color: white; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.3s; }
    button:hover { background: #1b4332; }
    #map { height: 350px; width: 100%; border-radius: 10px; margin-top: 15px; }
    .progress-section { margin-top: 2rem; border-top: 2px solid #ccc; padding-top: 1.5rem; }
    footer { text-align: center; padding: 1rem; background: #2d6a4f; color: white; }
    .fence-buttons, .photo-btns { display: flex; gap: 10px; margin-top: 10px; }
    .fence-buttons button, .photo-btns button { flex: 1; }
    #coordinates, #photoCoords { background: #f8f9fa; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 0.9rem; white-space: pre-wrap; border: 1px solid #ccc; max-height: 220px; overflow-y: auto; display: none; }
    #exactPos { margin-top: 8px; font-weight: 700; color: #0b6b3b; }
    #photoPreview { margin-top: 10px; width: 100%; border-radius: 10px; display: none; }
  </style>



  
</head>

<body>
  <header>
    <div class="header-container">
      <div class="logo" style="display:flex; align-items:center;">
        <img src="../images/logo.jpg" alt="AyurTrace Logo">
        <h1>AyurTrace</h1>
      </div>
      <nav>
        <a href="/">Home</a>
        <a href="#" class="active">Farmer Dashboard</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </nav>
    </div>
  </header>

  <main>
    <div class="dashboard-container">
      <h2>🌱 Farmer Activity Submission</h2>
      <p>Welcome! Please submit your farm details, perform land fencing, and add  updates.</p>

      <form id="farmerActivityForm">
        <label for="userid">Userid</label>
        <input type="text" id="userid">
        <label for="seedBill">Upload Seed Purchase Bill</label>
        <input type="file" id="seedBill" accept="image/*,application/pdf" required>

        <label for="landDetails">Land Details</label>
        <textarea id="landDetails" rows="3" placeholder="Enter your land details..." required></textarea>

        <label for="cropType">Type of Crop</label>
        <input list="cropList" id="cropType" placeholder="Type or select a crop" required>
        <datalist id="cropList">
          <option value="Turmeric"><option value="Tulsi"><option value="Ashwagandha"><option value="Neem"><option value="Aloe Vera"><option value="Brahmi">
        </datalist>

        <!-- Land Fencing -->
        <label>Land Fencing</label>
        <div class="fence-buttons">
          <button type="button" id="startFencing">Start Fencing</button>
          <button type="button" id="stopFencing" disabled>Stop Fencing</button>
        </div>

        <div id="map"></div>
        <label>Captured Coordinates</label>
        <div id="coordinates">No coordinates captured yet.</div>
        <div id="exactPos"></div>

        <label for="processStep">Current Process Step</label>
        <select id="processStep" required>
          <option value="">-- Select Step --</option>
          <option>Seed Sowing</option>
          <option>Fertilizer Application</option>
          <option>Weeding</option>
          <option>Harvesting</option>
          <option>Post-harvest Drying</option>
        </select>

        <!-- Weekly Farm Photo -->
        <label>Update Farm Photo</label>
        <div class="photo-btns">
          <button type="button" id="cameraBtn">📸 Camera</button>
          <button type="button" id="browseBtn">🗂️ Browse</button>
        </div>
        <input type="file" id="weeklyPhoto" accept="image/*" style="display:none">
        <img id="photoPreview" alt="Photo Preview">
        <div id="photoCoords"></div>

        <button type="submit">Submit Update</button>
      </form>

      <div class="progress-section" id="submittedData">
        <h3>📋 Submitted Updates</h3>
        <ul id="updateList"></ul>
      </div>
    </div>
  </main>

  <footer>
    © 2025 AyurTrace | Farmer Dashboard
  </footer>

<!-- <script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script> -->

  <script>
    // ================= MAP & FENCING =================

    const map = L.map('map').setView([20.5937, 78.9629], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    let rawPoints = [], acceptedPoints = [], polygonLayer = null, lastMarker = null, watchID = null;
    const ACCURACY_THRESHOLD = 30;
    const coordDiv = document.getElementById('coordinates');
    const exactDiv = document.getElementById('exactPos');
    const startBtn = document.getElementById('startFencing');
    const stopBtn = document.getElementById('stopFencing');

    function fmtSample(s) { return `Lat: ${s.lat.toFixed(6)}, Lng: ${s.lng.toFixed(6)} — acc: ${s.accuracy.toFixed(1)} m — ${s.t}`; }
    function refreshCoordDisplay() {
      if (!rawPoints.length) { coordDiv.textContent = 'No coordinates captured yet.'; exactDiv.textContent = ''; return; }
      coordDiv.style.display='block';
      coordDiv.textContent = rawPoints.map((p,i) => `${i+1}. ${fmtSample(p)} — ${(p.accuracy<=ACCURACY_THRESHOLD)?'ACCEPTED':'REJECTED'}`).join('\n');
      if (acceptedPoints.length) {
        const last = acceptedPoints[acceptedPoints.length-1];
        exactDiv.textContent = `Exact (last accepted): Lat ${last.lat.toFixed(6)}, Lng ${last.lng.toFixed(6)} (${last.accuracy.toFixed(1)} m)`;
      }
    }

    function drawPolygon() {
      if(polygonLayer) map.removeLayer(polygonLayer);
      if(acceptedPoints.length >= 3) {
        polygonLayer = L.polygon(acceptedPoints.map(p=>[p.lat,p.lng]),{color:'blue',fillOpacity:0.2}).addTo(map);
        map.fitBounds(polygonLayer.getBounds());
      }
    }

    startBtn.addEventListener('click',()=>{
      if(!navigator.geolocation) return alert('Geolocation not supported.');
      rawPoints=[]; acceptedPoints=[];
      if(polygonLayer) map.removeLayer(polygonLayer);
      startBtn.disabled=true; stopBtn.disabled=false;

      watchID = navigator.geolocation.watchPosition(pos=>{
        const {latitude:lat,longitude:lng,accuracy} = pos.coords;
        const t = new Date().toLocaleString();
        const sample = {lat,lng,accuracy,t};
        rawPoints.push(sample);
        if(accuracy<=ACCURACY_THRESHOLD) acceptedPoints.push(sample);
        if(lastMarker) map.removeLayer(lastMarker);
        lastMarker = L.circleMarker([lat,lng],{radius:6,color:accuracy<=ACCURACY_THRESHOLD?'green':'orange'}).addTo(map);
        drawPolygon(); refreshCoordDisplay();
      }, err=>alert('GPS error: '+err.message), {enableHighAccuracy:true});
    });

    stopBtn.addEventListener('click',()=>{
      if(watchID!==null) navigator.geolocation.clearWatch(watchID);
      startBtn.disabled=false; stopBtn.disabled=true;
      localStorage.setItem('fencedLand', JSON.stringify(acceptedPoints));
      alert('✅ Fencing stopped and saved.');
      refreshCoordDisplay();
    });

    // ================ WEEKLY PHOTO =================
    const fileInput = document.getElementById('weeklyPhoto');
    const preview = document.getElementById('photoPreview');
    const photoCoordsDiv = document.getElementById('photoCoords');

    document.getElementById('cameraBtn').addEventListener('click',()=>{ fileInput.setAttribute('capture','environment'); fileInput.click(); });
    document.getElementById('browseBtn').addEventListener('click',()=>{ fileInput.removeAttribute('capture'); fileInput.click(); });

    fileInput.addEventListener('change', (event)=>{
      const file = event.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = e=>{ preview.src=e.target.result; preview.style.display='block'; };
      reader.readAsDataURL(file);

      EXIF.getData(file,function(){
        const lat=EXIF.getTag(this,"GPSLatitude");
        const lon=EXIF.getTag(this,"GPSLongitude");
        const latRef=EXIF.getTag(this,"GPSLatitudeRef");
        const lonRef=EXIF.getTag(this,"GPSLongitudeRef");

        if(lat && lon){
          const latitude=convertToDecimal(lat,latRef);
          const longitude=convertToDecimal(lon,lonRef);
          photoCoordsDiv.style.display='block';
          photoCoordsDiv.innerHTML=`📍 Latitude: ${latitude}<br>📍 Longitude: ${longitude}`;

          const polygon = JSON.parse(localStorage.getItem('fencedLand')||'[]').map(p=>[p.lat,p.lng]);
          if(polygon.length>=3){
            const inside = isPointInPolygon([latitude,longitude], polygon);
            photoCoordsDiv.innerHTML += `<br><b>${inside?'✅ Inside Farm Area':'❌ Outside Farm Area'}</b>`;
          }
        }else{
          photoCoordsDiv.style.display='block';
          photoCoordsDiv.innerHTML="⚠️ No GPS data found. Try camera with location access.";
        }
      });
    });

    function convertToDecimal(coord, ref){
      let decimal = coord[0]+coord[1]/60+coord[2]/3600;
      return (ref==="S"||ref==="W") ? decimal*-1 : decimal;
    }

    function isPointInPolygon(point, polygon){
      const [x,y]=point;
      let inside=false;
      for(let i=0,j=polygon.length-1;i<polygon.length;j=i++){
        const xi=polygon[i][0], yi=polygon[i][1], xj=polygon[j][0], yj=polygon[j][1];
        const intersect=((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi);
        if(intersect) inside=!inside;
      }
      return inside;
    }

    // ================ FORM SUBMISSION =================
   document.getElementById("farmerActivityForm").addEventListener("submit", async function (e) {
  e.preventDefault(); // Stop the page from reloading

  // Collect all form data
  const formData = new FormData();
   formData.append("userid", document.getElementById("userid").value);
  formData.append("seedBill", document.getElementById("seedBill").files[0]);
  formData.append("landDetails", document.getElementById("landDetails").value);
  formData.append("cropType", document.getElementById("cropType").value);
  formData.append("processStep", document.getElementById("processStep").value);
  formData.append("coordinates", document.getElementById("coordinates").innerText);
  formData.append("weeklyPhoto", document.getElementById("weeklyPhoto").files[0]);

  try {
    const response = await fetch("http://localhost:4000/api/farmer-dashboard", {
      method: "POST",
      body: formData
    });

    const data = await response.json();

    if (response.ok) {
      alert("✅ Farmer activity submitted successfully!");
      console.log("Server Response:", data);
      document.getElementById("updateList").innerHTML += `<li>${data.message}</li>`;
    } else {
      alert("❌ Error: " + data.error);
    }
  } catch (error) {
    console.error("Error submitting form:", error);
    alert("⚠️ Failed to connect to server. Check backend or network.");
  }
});

    function logout(){ alert('You have been logged out.'); window.location.href='/'; }
  </script>
</body>
</html>
