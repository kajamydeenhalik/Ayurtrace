// 🔐  manufacturer login
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;

  const res = await fetch("http://localhost:4000/authmanu/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password, role: "manufacturer" })
  });

  const data = await res.json();
  
  if (res.ok) {
    // Save token for future authenticated requests
    localStorage.setItem('labToken', data.token);
    alert("Login successful!");
    // redirect to dashboard
    window.location.href = "http://localhost:4000/final-manu.html";
  } else {
    alert(data.message || "Login failed");
    console.log("failed in login");
  }
});
