<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pending Farmer Requests | AyurTrace</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    body { font-family: Poppins, sans-serif; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    th { background: #2b6e4f; color: white; }
    button { padding: 8px 16px; border: none; border-radius: 5px; background: #2b6e4f; color: white; cursor: pointer; }
    #verifyForm { margin-top: 20px; padding: 20px; border: 2px solid #2b6e4f; border-radius: 10px; display: none; }
    label { font-weight: bold; display: block; margin-top: 10px; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; }
    #map { height: 300px; margin-top: 10px; border-radius: 10px; }
  </style>
</head>
<body>
  <h2>🌾 Pending Farmer Requests</h2>
  <table id="farmerTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Farmer Name</th>
        <th>Crop Type</th>
        <th>Process Step</th>
        <th>Coordinates</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <form id="verifyForm">
    <h3>🧪 Lab Verification Form</h3>
    <input type="hidden" id="farmerId" />

    <label>Lab ID</label>
    <input type="text" id="lab_id" placeholder="Enter Lab ID" required>

    <label>Lab Name</label>
    <input type="text" id="lab_name" placeholder="Enter Lab Name" required>

    <label>Verification Status</label>
    <select id="verification_status">
      <option value="Approved">Approved</option>
      <option value="Rejected">Rejected</option>
    </select>

    <label>Remarks</label>
    <textarea id="remarks" placeholder="Enter remarks"></textarea>

    <label>Location</label>
    <button type="button" id="getLocationBtn">📍 Get Current Location</button>

    <label>Address</label>
    <input type="text" id="lab_location" placeholder="Detected Address">

    <div id="map"></div>

    <input type="hidden" id="latitude">
    <input type="hidden" id="longitude">

    <button type="submit">Submit Verification</button>
  </form>

  <script>
    let selectedFarmerId = null;
    let map, marker;

    async function loadFarmerRequests() {
      const res = await fetch("http://localhost:4000/farmer/pending");
      const farmers = await res.json();
      const tbody = document.querySelector("#farmerTable tbody");
      tbody.innerHTML = "";
      farmers.forEach(f => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${f.id}</td>
          <td>${f.farmer_name}</td>
          <td>${f.crop_type}</td>
          <td>${f.process_step}</td>
          <td>${f.coordinates || "—"}</td>
          <td>${f.status}</td>
          <td><button onclick="openVerifyForm(${f.id})">Verify</button></td>
        `;
        tbody.appendChild(row);
      });
    }

    function openVerifyForm(id) {
      selectedFarmerId = id;
      document.getElementById("verifyForm").style.display = "block";
      document.getElementById("farmerId").value = id;

      if (!map) {
        map = L.map("map").setView([10.7905, 78.7047], 7); // default India center
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "© OpenStreetMap contributors"
        }).addTo(map);
      }
    }

    document.getElementById("getLocationBtn").addEventListener("click", () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          document.getElementById("latitude").value = lat;
          document.getElementById("longitude").value = lon;

          if (marker) map.removeLayer(marker);
          marker = L.marker([lat, lon]).addTo(map);
          map.setView([lat, lon], 15);

          // Get detailed address
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&addressdetails=1`);
          const data = await res.json();
          if (data && data.address) {
            const addr = data.address;
            const fullAddr = [addr.road, addr.city, addr.state, addr.country, addr.postcode].filter(Boolean).join(", ");
            document.getElementById("lab_location").value = fullAddr;
          }
        });
      } else alert("Geolocation not supported");
    });

    document.getElementById("verifyForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        lab_userid: 1, // Replace with actual logged-in user ID
        lab_id: document.getElementById("lab_id").value,
        lab_name: document.getElementById("lab_name").value,
        verification_status: document.getElementById("verification_status").value,
        remarks: document.getElementById("remarks").value,
        lab_location: document.getElementById("lab_location").value,
        latitude: document.getElementById("latitude").value,
        longitude: document.getElementById("longitude").value
      };

      const res = await fetch(`http://localhost:4000/lab/verify/${selectedFarmerId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      alert(data.message);
      document.getElementById("verifyForm").reset();
      document.getElementById("verifyForm").style.display = "none";
      loadFarmerRequests();
    });

    loadFarmerRequests();
  </script>
</body>
</html>
