  <script>
    AOS.init({ duration: 1000, once: true });

    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const uploadForm = document.getElementById('uploadForm');
    const showSignup = document.getElementById('showSignup');
    const showLogin = document.getElementById('showLogin');

    // Switch between forms
    showSignup.addEventListener('click', () => {
      loginForm.style.display = 'none';
      signupForm.style.display = 'block';
    });

    showLogin.addEventListener('click', () => {
      signupForm.style.display = 'none';

// 📝 analyticore Signup
  


 signupForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("signupEmail").value;
  const password = document.getElementById("signupPassword").value;
  const confirm = document.getElementById('signupConfirmPassword').value;

      if (password !== confirm) {
        alert('Passwords do not match.');
        return;
      }

  const res = await fetch("http://localhost:4000/authlab/signup", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();
  alert(data.message);
});

// 🔐  analyticore login
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;

  const res = await fetch("http://localhost:4000/authlab/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password, role: "analyticore" })
  });

  const data = await res.json();
  
  if (res.ok) {
    // Save token for future authenticated requests
    localStorage.setItem('labToken', data.token);
    alert("Login successful!");
    // redirect to dashboard
    window.location.href = "http://localhost:4000/farmer-pending-request.html";
  } else {
    alert(data.message || "Login failed");
    console.log("failed in login");
  }
});
